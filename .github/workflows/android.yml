name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # serve per pubblicare la release con l'APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Versione 0.1.N: N cresce a ogni compilazione, così lo store
      # riconosce sempre la versione più recente.
      - name: Compilazione APK
        run: |
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk kairos-flutter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-flutter-apk
          path: kairos-flutter.apk

      # Release pubblica: l'ultima versione ha sempre lo stesso link, usato dal Kairos Store:
      # https://github.com/mariopiccolo8562-lang/kairos-flutter/releases/latest/download/kairos-flutter.apk
      - name: Pubblicazione (link fisso per il Kairos Store)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kairos Flutter 0.1.${{ github.run_number }}
          files: kairos-flutter.apk
          make_latest: true
