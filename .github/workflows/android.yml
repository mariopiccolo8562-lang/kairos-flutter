name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # serve per pubblicare la release con l'APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Chiave di firma definitiva: bastano i segreti ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD
      # (alias «kairosplus», stessa password per la chiave). ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD
      # servono solo se la chiave è stata creata in un altro modo. Senza segreti: firma di anteprima.
      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            [ -n "$KS_PASS" ] || { echo "::error::Manca il segreto ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
              || { echo "::error::ANDROID_KEYSTORE_B64 non è copiato per intero: incollalo di nuovo"; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" > /dev/null \
              || { echo "::error::La chiave non si apre: controlla ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firma con la chiave definitiva"
          else
            echo "::warning::Nessuna chiave definitiva nei segreti: APK firmato con la chiave di anteprima"
          fi

      # Versione 0.1.N: N cresce a ogni compilazione, così lo store
      # riconosce sempre la versione più recente. Solo ARM (Fire TV, Android TV, telefoni).
      - name: Compilazione APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kairosplus' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk kairos-plus.apk
          ls -l kairos-plus.apk
          # con quale chiave è firmato (anteprima o definitiva)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$AS" ]; then "$AS" verify --print-certs kairos-plus.apk | grep -E "certificate (DN|SHA-256)" || true; fi

      # File letto dal pannello Kairos per sapere qual è l'ultima versione di Kairos Plus
      - name: Versione per il pannello
        run: |
          V="0.1.${{ github.run_number }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/kairos-plus.apk"
          jq -n --arg v "$V" --argjson c ${{ github.run_number }} --arg u "$URL" --arg d "$(date -u +%FT%TZ)" \
            '{version:$v, versionCode:$c, url:$u, date:$d}' > kairos-plus.json
          cat kairos-plus.json

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-plus-apk
          path: kairos-plus.apk

      # Release pubblica: l'ultima versione ha sempre lo stesso link, usato dal Kairos Store:
      # https://github.com/mariopiccolo8562-lang/kairos-flutter/releases/latest/download/kairos-plus.apk
      - name: Pubblicazione (link fisso per il Kairos Store)
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kairos Plus 0.1.${{ github.run_number }}
          files: |
            kairos-plus.apk
            kairos-plus.json
          make_latest: true

      # Se GitHub risponde con un errore (es. 500) la release si pubblica comunque:
      # nuovi tentativi con un altro sistema, a distanza crescente.
      - name: Pubblicazione (nuovo tentativo)
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Kairos Plus 0.1.${{ github.run_number }}" --notes "Kairos Plus 0.1.${{ github.run_number }}" --target "$GITHUB_SHA"; then
              if gh release upload "$TAG" kairos-plus.apk kairos-plus.json --clobber && gh release edit "$TAG" --draft=false --latest; then
                echo "Release pubblicata al tentativo $i"
                exit 0
              fi
            fi
            echo "Tentativo $i non riuscito, riprovo tra $((i * 20)) secondi"
            sleep $((i * 20))
          done
          echo "::error::Release non pubblicata: GitHub non risponde"
          exit 1
