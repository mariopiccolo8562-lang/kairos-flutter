name: Prove del ramo aggiornamenti-solo-download

# Controllo del codice e test sul ramo di lavoro: niente compilazione firmata, niente artefatti, niente release.
# Prima dell'unione in main si cancella (su main non parte comunque).
on:
  push:
    branches: [aggiornamenti-solo-download]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
