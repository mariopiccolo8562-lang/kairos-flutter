name: Prove del ramo controllo-app

# Solo controllo del codice e test sul ramo di lavoro: niente APK, niente firma, niente artefatti, niente release.
# Dopo l'unione in main si può cancellare (su main non parte comunque).
on:
  push:
    branches: [controllo-app]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
